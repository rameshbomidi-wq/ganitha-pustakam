name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/

      - name: Capacitor Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "గణిత పుస్తకం" in.raayeducation.ganitham --web-dir=www
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icons/icon-1024.png assets/icon-only.png
          cp icons/icon-1024.png assets/splash.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#2e9e5b' --splashBackgroundColor '#c7d7cb'

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Ganitha-Pustakam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ganitha-Pustakam-APK
          path: Ganitha-Pustakam.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ganitha Pustakam APK ${{ github.run_number }}
          files: Ganitha-Pustakam.apk
